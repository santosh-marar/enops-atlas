name: Release npm packages

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm --version && npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          commit: "chore: release"
          publish: pnpm release
          title: "chore: release"
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token. Publishing is authorised by npm trusted publishing:
          # each package trusts this repository and this workflow file, and
          # `id-token: write` above lets npm exchange the run's identity for a
          # short-lived publish credential. Needs npm 11.5.1 or newer.
          NPM_CONFIG_PROVENANCE: "true"
