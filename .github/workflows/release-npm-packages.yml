name: Release npm packages

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm --version && npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # Versions are bumped locally (`pnpm version-packages`) and committed, so a
      # push to main only has to publish what npm does not have yet. Publishing
      # is authorised by npm trusted publishing: each package trusts this
      # repository and this workflow file, and `id-token: write` above lets npm
      # exchange the run's identity for a short-lived credential (npm 11.5.1+).
      - run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"
      # `changeset publish` tags each release locally; share the tags.
      - run: git push origin --tags
